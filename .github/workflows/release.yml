name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajusta versão e links do manifesto
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/guia-da-mesa.zip" \
             '.version = $v | .download = $d' module.json > module.tmp && mv module.tmp module.json

      - name: Empacota
        run: zip -r guia-da-mesa.zip module.json scripts styles lang README.md

      - name: Anexa ao release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            guia-da-mesa.zip
